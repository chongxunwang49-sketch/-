# 多智能体股票分析系统 - 一键编排(步骤15)
# 三个服务: backend(本项目后端) + postgres(数据存储) + chroma(向量库)
# 启动: docker compose up -d --build
# 访问: http://localhost:8000/health
#
# 说明:
# - LLM/Embedding 走宿主机 Ollama,容器通过 host.docker.internal 访问
# - .env 不随镜像打包;容器用 environment 覆盖关键配置
services:
  postgres:
    image: postgres:15-alpine
    container_name: stock-agent-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock_agent
    ports:
      - "5433:5432"   # 5433 对外,避免与本机手动容器 5432 冲突(compose 内部用服务名 postgres)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    container_name: stock-agent-chroma
    ports:
      - "8001:8000"   # 宿主 8001 -> 容器 8000(chroma 默认端口)
    volumes:
      - chromadata:/chroma/chroma

  backend:
    build: .
    container_name: stock-agent-backend
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock_agent
      # LLM 可插拔:默认 ollama;设 LLM_PROVIDER=dashscope 并配 DASHSCOPE_API_KEY 走阿里云百炼
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
      # 用户体系(第一批)
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-prod}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-72}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started

  # 专业看板前端(与后端共用同一镜像,改 CMD 启动 Streamlit)
  frontend:
    build: .
    container_name: stock-agent-frontend
    ports:
      - "8501:8501"
    environment:
      API_BASE: http://backend:8000
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      backend:
        condition: service_started

  # 第六批:缓存(供后续扩展;当前非关键依赖)
  redis:
    image: redis:7-alpine
    container_name: stock-agent-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # 第六批:统一入口反向代理(可选;8080 -> API /api + 前端 UI /)
  nginx:
    image: nginx:alpine
    container_name: stock-agent-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  chromadata:
