# 统一入口反向代理(第六批,可选)
# 访问 http://localhost:8080 :
#   /api/*  -> 后端 FastAPI(去掉 /api 前缀)
#   /       -> 前端 Streamlit(含 WebSocket 升级)
# 说明:即使不启用本代理,前端(8501)/后端(8000)仍可独立直连。

upstream stock_backend { server backend:8000; }
upstream stock_frontend { server frontend:8501; }

server {
    listen 80;
    client_max_body_size 20m;

    # API 网关:/api/* -> 后端
    location /api/ {
        proxy_pass http://stock_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # 前端 Streamlit(含 WebSocket)
    location / {
        proxy_pass http://stock_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
}
